[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recursive-ssd"
version = "0.1.0"
description = "Bounded, label-free recursive self-policy distillation pilot"
requires-python = ">=3.11,<3.13"
dependencies = [
  "torch==2.6.0", "transformers==4.51.3", "peft==0.15.2",
  "accelerate==1.6.0", "datasets==3.5.0", "huggingface-hub==0.30.2",
  "numpy==2.2.6", "safetensors==0.5.3", "jinja2>=3.1,<4",
]

[project.optional-dependencies]
test = ["pytest==8.3.5"]

[project.scripts]
recursive-ssd = "recursive_ssd.cli:main"

[tool.setuptools.packages.find]
include = ["recursive_ssd*"]

[tool.setuptools.package-data]
recursive_ssd = ["templates/*.j2", "templates/APPLE_LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
